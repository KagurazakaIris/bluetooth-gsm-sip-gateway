services:
  asterisk-mobile:
    # 可选环境变量 GATEWAY_IMAGE：指定 GHCR 或其他预构建镜像；未设置时使用本地镜像名。
    image: "${GATEWAY_IMAGE:-bluetooth-gsm-sip-gateway:local}"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asterisk-mobile
    privileged: true
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    # 使用宿主机网络，不需要 ports 映射；服务直接监听以下宿主机端口：
    # - Web 管理：8080/TCP（可通过 GATEWAY_WEB_PORT 修改）
    # - SIP 信令：5060/UDP
    # - RTP 媒体：10000-10100/UDP
    # - 本地 Baresip：5070/UDP、4444/TCP（仅监听 127.0.0.1）
    network_mode: host
    pid: host
    ipc: host
    volumes:
      - /dev:/dev
      # 容器启动时按需加载宿主机的 snd-aloop 内核模块。
      - /lib/modules:/lib/modules:ro
      - /var/lib/bluetooth:/var/lib/bluetooth
      - gateway-state:/var/lib/gateway
      - ./Recordings:/var/spool/asterisk/monitor
    environment:
      # GATEWAY_WEB_HOST：Web 管理服务监听地址，默认监听所有网络接口。
      GATEWAY_WEB_HOST: "${GATEWAY_WEB_HOST:-0.0.0.0}"
      # GATEWAY_WEB_PORT：Web 管理服务监听端口，默认 8080/TCP。
      GATEWAY_WEB_PORT: "${GATEWAY_WEB_PORT:-8080}"
      # GATEWAY_ADMIN_TOKEN：可选管理令牌；空值表示不启用令牌校验。
      GATEWAY_ADMIN_TOKEN: "${GATEWAY_ADMIN_TOKEN:-}"
      # GATEWAY_RESTORE_HOST_ON_STOP：1 表示容器停止时归还宿主机蓝牙，0 表示保持交接状态。
      GATEWAY_RESTORE_HOST_ON_STOP: "${GATEWAY_RESTORE_HOST_ON_STOP:-1}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${GATEWAY_WEB_PORT}/api/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  gateway-state:
