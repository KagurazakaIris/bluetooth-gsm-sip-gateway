[general]
static=yes
writeprotect=no
clearglobalvars=no

[reject-unknown]
exten => _X.,1,Hangup()

[from-sip]
exten => _X.,1,NoOp(Outgoing HFP to ${EXTEN})
 same => n,Set(CALLERID(num)=${EXTEN})
 same => n,Dial(SIP/hfp@hfp,60,U(record-call^outbound))
 same => n,Hangup()

[from-hfp]
exten => 1001,1,NoOp(Incoming HFP to SIP/1001)
 same => n,Set(HFP_TO=${SIP_HEADER(To)})
 same => n,Set(HFP_RAW=${CUT(HFP_TO,=,2)})
 same => n,Set(HFP_NUM=${CUT(HFP_RAW,>,1)})
 same => n,Set(HFP_NUM=${FILTER(0-9+*#,${HFP_NUM})})
 same => n,ExecIf($["${HFP_NUM}" != ""]?Set(CALLERID(num)=${HFP_NUM}))
 same => n,Dial(SIP/1001,30,U(record-call^inbound))
 same => n,Hangup()

[record-call]
exten => s,1,MixMonitor(/var/spool/asterisk/monitor/${ARG1}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav,b)
 same => n,Return()
