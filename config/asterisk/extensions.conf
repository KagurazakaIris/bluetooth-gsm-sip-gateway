[general]
static=yes
writeprotect=no
clearglobalvars=no

[reject-unknown]
exten => _X.,1,Hangup()

[from-sip]
exten => _X.,1,NoOp(Outgoing HFP to ${EXTEN})
 same => n,Set(CALLERID(num)=${EXTEN})
 same => n,Dial(SIP/hfp@hfp,60,U(record-call^outbound))
 same => n,Hangup()

[from-hfp]
exten => 1001,1,NoOp(Incoming HFP to SIP/1001)
 same => n,Dial(SIP/1001,30,U(record-call^inbound))
 same => n,Hangup()

[record-call]
exten => s,1,MixMonitor(/var/spool/asterisk/monitor/${ARG1}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav,b)
 same => n,Return()
