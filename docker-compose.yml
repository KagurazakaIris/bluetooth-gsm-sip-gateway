services:
  asterisk-mobile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asterisk-mobile
    privileged: true
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    network_mode: host
    pid: host
    ipc: host
    volumes:
      - /dev:/dev
      - /var/lib/bluetooth:/var/lib/bluetooth
      - gateway-state:/var/lib/gateway
    environment:
      GATEWAY_WEB_HOST: ${GATEWAY_WEB_HOST:-0.0.0.0}
      GATEWAY_WEB_PORT: ${GATEWAY_WEB_PORT:-8080}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
      GATEWAY_RESTORE_HOST_ON_STOP: ${GATEWAY_RESTORE_HOST_ON_STOP:-1}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${GATEWAY_WEB_PORT}/api/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  gateway-state:
