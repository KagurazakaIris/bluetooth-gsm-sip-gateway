[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
MOBILE_IFACE=mobile_phone

[from-sip]
exten => _X.,1,NoOp(Outbound via ${MOBILE_IFACE}: ${EXTEN})
 same => n,Dial(Mobile/${MOBILE_IFACE}/${EXTEN},60)
 same => n,Hangup()

[from-mobile]
exten => s,1,NoOp(Incoming GSM from ${CALLERID(all)} on ${CHANNEL})
 same => n,Dial(SIP/1001,30)
 same => n,Hangup()
