[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
MOBILE_IFACE=mobile_phone

[from-sip]
exten => _X.,1,NoOp(Outbound via ${MOBILE_IFACE}: ${EXTEN})
 same => n,Dial(Mobile/${MOBILE_IFACE}/${EXTEN},60,U(record-call^outbound))
 same => n,Hangup()

[from-mobile]
exten => s,1,NoOp(Incoming GSM from ${CALLERID(all)} on ${CHANNEL})
 same => n,Dial(SIP/1001,30,U(record-call^inbound))
 same => n,Hangup()

[record-call]
exten => s,1,MixMonitor(/var/spool/asterisk/monitor/${ARG1}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav,b)
 same => n,Return()
